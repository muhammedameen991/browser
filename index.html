<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>OnionShell Browser — Privacy-Focused Desktop Interface</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icons/onion.svg" />
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/toolbar.css" />
  <link rel="stylesheet" href="./css/tabs.css" />
  <link rel="stylesheet" href="./css/settings.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
  <div id="app-shell" class="browser-window">
    <!-- Tab Strip -->
    <header class="tab-bar" role="tablist" aria-label="Browser Tabs">
      <div class="window-brand" title="OnionShell Desktop Interface">
        <svg class="onion-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C9.5 5 6 7.8 6 13a6 6 0 0 0 12 0c0-5.2-3.5-8-6-11zm0 3.2c1.8 2.3 3.8 4.4 3.8 7.8a3.8 3.8 0 0 1-7.6 0c0-3.4 2-5.5 3.8-7.8z" fill="currentColor"/>
          <circle cx="12" cy="13.2" r="1.8" fill="currentColor"/>
        </svg>
      </div>
      <div id="tabs-container" class="tabs-container"></div>
      <button id="btn-new-tab" class="icon-btn new-tab-btn" title="New Tab (Ctrl+T)" aria-label="New Tab">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>
      </button>
      <div class="tab-bar-spacer"></div>
      <div id="tor-status-pill" class="tor-pill disconnected" role="button" tabindex="0" title="View Tor Network Status">
        <span class="status-dot"></span>
        <span class="status-label">Tor: Not Connected</span>
      </div>
    </header>

    <!-- Navigation Toolbar -->
    <nav class="nav-toolbar" aria-label="Primary Navigation">
      <div class="nav-controls">
        <button id="btn-back" class="icon-btn" title="Back (Alt+Left)" aria-label="Back" disabled>
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
        </button>
        <button id="btn-forward" class="icon-btn" title="Forward (Alt+Right)" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" fill="currentColor"/></svg>
        </button>
        <button id="btn-reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/></svg>
        </button>
        <button id="btn-home" class="icon-btn" title="Home" aria-label="Home">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/></svg>
        </button>
      </div>

      <!-- Address & Search Omnibox -->
      <form id="omnibox-form" class="omnibox-wrapper" autocomplete="off">
        <button type="button" id="btn-site-info" class="omnibox-badge" title="Connection & Security Info">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/></svg>
        </button>
        <span id="omnibox-engine-tag" class="engine-tag">DuckDuckGo</span>
        <input
          id="omnibox-input"
          type="text"
          spellcheck="false"
          placeholder="Search with DuckDuckGo or enter address (e.g. about:tor, https://example.com)"
          aria-label="Search or enter address"
        />
        <button type="button" id="btn-bookmark" class="icon-btn omnibox-action" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark">
          <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z" fill="currentColor"/></svg>
        </button>
        <div id="omnibox-suggestions" class="omnibox-dropdown hidden" role="listbox"></div>
      </form>

      <!-- Action Buttons -->
      <div class="toolbar-actions">
        <button id="btn-security-level" class="security-shield-btn" title="Security Level: Standard" aria-label="Security Level">
          <svg viewBox="0 0 24 24"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" fill="currentColor"/></svg>
          <span id="security-level-label">Standard</span>
        </button>
        <button id="btn-private-toggle" class="icon-btn" title="New Private Tab (Ctrl+Shift+P)" aria-label="New Private Tab">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/></svg>
        </button>
        <button id="btn-downloads" class="icon-btn" title="Downloads (Ctrl+J)" aria-label="Downloads">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/></svg>
        </button>
        <button id="btn-bookmarks-drawer" class="icon-btn" title="Bookmarks (Ctrl+Shift+B)" aria-label="Bookmarks">
          <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z" fill="currentColor"/></svg>
        </button>
        <button id="btn-menu" class="icon-btn" title="Open Application Menu" aria-label="Application Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/></svg>
        </button>
      </div>
    </nav>

    <!-- Bookmarks Bar (Toggleable) -->
    <div id="bookmarks-bar" class="bookmarks-bar"></div>

    <!-- Loading Progress Indicator -->
    <div id="loading-bar" class="loading-bar"></div>

    <!-- Main Browser Menu Dropdown -->
    <aside id="app-menu" class="app-menu hidden" role="menu">
      <button class="menu-item" data-action="new-tab"><span>New Tab</span><kbd>Ctrl+T</kbd></button>
      <button class="menu-item" data-action="new-private-tab"><span>New Private Tab</span><kbd>Ctrl+Shift+P</kbd></button>
      <hr />
      <button class="menu-item" data-nav="about:tor"><span>Tor Network &amp; Diagnostics</span></button>
      <button class="menu-item" data-nav="about:bookmarks"><span>Bookmarks Manager</span><kbd>Ctrl+Shift+B</kbd></button>
      <button class="menu-item" data-nav="about:history"><span>History</span><kbd>Ctrl+H</kbd></button>
      <button class="menu-item" data-nav="about:downloads"><span>Downloads</span><kbd>Ctrl+J</kbd></button>
      <hr />
      <button class="menu-item" data-nav="about:privacy"><span>Privacy Dashboard</span></button>
      <button class="menu-item" data-nav="about:security"><span>Security Level Settings</span></button>
      <button class="menu-item" data-nav="about:preferences"><span>Settings</span><kbd>Ctrl+,</kbd></button>
      <hr />
      <button class="menu-item" data-action="fullscreen"><span>Toggle Full Screen</span><kbd>F11</kbd></button>
      <button class="menu-item" data-nav="about:about"><span>About OnionShell</span></button>
    </aside>

    <!-- Viewport Container (Holds Internal Pages & Sandboxed Web Frames) -->
    <main id="browser-viewport" class="browser-viewport"></main>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
